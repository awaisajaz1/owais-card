<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Muhammad Owais Ajaz — Managing Consultant Data Analytics & AI at Qorelogix.">
<title>Muhammad Owais Ajaz | Qorelogix</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #eef1f5;
    color: #17202a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 40px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    overflow: hidden;
  }

  /* ── Header banner ── */
  .banner {
    background: #0f1c2e;
    padding: 24px 28px 0;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  /* Logo — full width, prominent */
  .logo-wrap {
    width: 100%;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
  }

  .logo-img {
    height: 44px;
    width: auto;
    max-width: 220px;
    object-fit: contain;
    display: block;
  }

  .logo-text {
    display: none;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 0.05em;
  }

  .logo-img.error { display: none; }
  .logo-img.error ~ .logo-text { display: block; }

  /* Profile photo + name row */
  .profile-row {
    display: flex;
    align-items: flex-end;
    gap: 18px;
    width: 100%;
  }

  .avatar-wrap {
    flex-shrink: 0;
    margin-bottom: -30px;
  }

  .avatar-initials {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 3px solid #fff;
    background: linear-gradient(135deg, #1e3a5f, #2d5a9e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: #93c5fd;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .avatar-photo {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 3px solid #fff;
    object-fit: cover;
    display: none;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .banner-name {
    padding-bottom: 36px;
    flex: 1;
  }

  .banner-name h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 5px;
  }

  .banner-name .title {
    font-size: 12px;
    font-weight: 400;
    color: #93c5fd;
    line-height: 1.5;
  }

  /* ── Body ── */
  .body {
    padding: 42px 24px 26px;
  }

  .company-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
  }

  .company-label {
    font-size: 13px;
    color: #667085;
  }

  /* Save contact */
  .save-box {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    margin-bottom: 18px;
    text-decoration: none;
    color: #17202a;
    transition: background 0.2s;
  }

  .save-box:hover { background: #eef2f7; }

  .save-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .save-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: #0f1c2e;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .save-text strong { display: block; font-size: 14px; font-weight: 600; }
  .save-text span { font-size: 12px; color: #667085; }

  /* Buttons */
  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 18px;
  }

  .btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    border-radius: 13px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    color: #17202a;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    transition: background 0.15s, border-color 0.15s;
  }

  .btn:hover { background: #eef2f7; border-color: #c8d3e0; }
  .btn.full { grid-column: 1 / -1; }

  .btn-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
  }

  .ic-call  { background: #dcfce7; }
  .ic-wa    { background: #dcfce7; }
  .ic-email { background: #fef9c3; }
  .ic-li    { background: #dbeafe; }
  .ic-web   { background: #ede9fe; }
  .ic-gh    { background: #f1f5f9; }
  .ic-li2   { background: #dbeafe; }

  .divider { height: 1px; background: #e2e8f0; margin: 4px 0 14px; }

  .footer { text-align: center; font-size: 11px; color: #adb5bd; }
  .footer a { color: #667085; text-decoration: none; }
</style>
</head>
